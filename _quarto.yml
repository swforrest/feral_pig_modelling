project:
  type: website
  output-dir: docs
  resources:
    - outputs/**/*.html # interactive folium maps, embedded as iframes in the deepSSF predictions page

execute:
  freeze: auto # re-render only when source changes

website:
  title: "Kakadu Pig Modelling"
  favicon: icons/pig_image.jpeg
  page-navigation: true
  back-to-top-navigation: true
  
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Data Preparation"
        href: data_preparation_east_alligator.qmd
      - text: "Space Use"
        href: space_use_monthly-mcp_east_alligator.qmd
      - text: "Revisitation"
        href: revisitation_analysis.qmd
      - text: "Weather Responses"
        href: weather_analysis_acute_east_alligator.qmd
      - text: "Shooting Responses"
        href: shooting_analysis_east_alligator.qmd
      - text: "deepSSF"
        href: deepSSF.qmd
        
    right:
      - icon: github
        href: https://github.com/swforrest/feral_pig_modelling
        
  sidebar:
      - title: "deepSSF"
        style: floating
        contents: 
          - deepSSF.qmd
          - deepssf_piggies_train.ipynb
          - deepssf_piggies_predict_hab-prob_start.ipynb

format:
  html:
    theme:
      - cosmo
      - brand
